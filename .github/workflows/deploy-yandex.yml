# RU production (Yandex Cloud, ru-central1): build the image, push it to Container Registry and deploy
# a Serverless Container revision with deploy/yandex/deploy.sh. See docs/deploy/yandex-ru.md, and make
# the owner decisions listed there (data residency, inbound mail, scheduler) before the first run.
#
# Manual only: never runs on push. Runs in the `production-ru` GitHub environment, which the owner
# configures with required reviewers and (Settings > Environments):
#   secrets  YC_SA_KEY_JSON   authorized key (JSON) of the deploy service account
#   vars     YC_CLOUD_ID, YC_FOLDER_ID, YC_REGISTRY_ID, YC_SA_ID (runtime service account), YC_LOCKBOX_ID
#            YC_LOCKBOX_OPTIONAL_KEYS (space-separated Lockbox keys to mount: MAIL_BLIND_KEY at launch, MAIL_BLOB_KEYS
#            during a key rotation, MAIL_SMTP_PASSWORD and MAIL_DKIM_PRIVATE_KEY for outside mail, Stripe keys)
# App secrets (BETTER_AUTH_SECRET, DATABASE_URL, MAIL_BLOB_KEY, MAIL_S3_*) stay in Yandex Lockbox and
# are attached to the container by reference; they never pass through GitHub.
name: Deploy RU (Yandex Cloud)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy ru" to proceed
        required: true
        type: string

concurrency:
  group: deploy-yandex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-ru
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cumulus_mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cumulus_mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # No third-party grok.com script (owner decision 2026-11-16; the Russia copy never had it).
      VITE_GROK_EXTENSIONS: "0"
      # Same local Postgres and S3 as CI, so npm test can run the runtime/S3 checks.
      MAIL_RUNTIME_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cumulus_mail
      MAIL_S3_ENDPOINT: http://127.0.0.1:8333
      MAIL_S3_BUCKET: cumulus-mail
      MAIL_S3_REGION: us-east-1
      MAIL_S3_ACCESS_KEY_ID: cumulus
      MAIL_S3_SECRET_ACCESS_KEY: cumulussecret
      MAIL_S3_LOOPBACK_ONLY: "1"
    steps:
      - name: Check the confirmation phrase
        if: inputs.confirm != 'deploy ru'
        run: |
          echo "Confirmation phrase does not match. Nothing deployed."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start SeaweedFS
        run: |
          set -euo pipefail
          name="cumulus-s3-${GITHUB_RUN_ID}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          # Older runs left a fixed-name container holding 8333 on the shared runner.
          docker rm -f cumulus-s3 >/dev/null 2>&1 || true
          port="$(python3 - <<'PY'
          import os, random, socket
          tail = int((os.environ.get("GITHUB_RUN_ID") or "0")[-5:])
          candidates = [8333, 20000 + (tail % 20000)]
          candidates += [random.randint(20000, 45000) for _ in range(12)]
          for port in candidates:
              sock = socket.socket()
              try:
                  sock.bind(("127.0.0.1", port))
              except OSError:
                  continue
              finally:
                  sock.close()
              print(port)
              break
          else:
              raise SystemExit("no free port for SeaweedFS")
          PY
          )"
          mkdir -p "/tmp/seaweedfs-${GITHUB_RUN_ID}"
          cat > "/tmp/seaweedfs-${GITHUB_RUN_ID}/s3.json" <<'EOF'
          {
            "identities": [
              {
                "name": "cumulus",
                "credentials": [{ "accessKey": "cumulus", "secretKey": "cumulussecret" }],
                "actions": ["Admin", "Read", "List", "Tagging", "Write"]
              }
            ]
          }
          EOF
          docker run -d --name "$name" -p "127.0.0.1:${port}:8333" \
            -v "/tmp/seaweedfs-${GITHUB_RUN_ID}/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}/" || true)
            if [ "$code" != "000" ]; then
              echo "MAIL_S3_ENDPOINT=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
              echo "CUMULUS_S3_CONTAINER=${name}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs "$name"
          exit 1
      - name: Checks before deploying
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - name: Sign in to Yandex Cloud
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_CLOUD_ID: ${{ vars.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          test -n "$YC_SA_KEY_JSON" || { echo "YC_SA_KEY_JSON is not set"; exit 1; }
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SA_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create deploy >/dev/null
          yc config set service-account-key "$key"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"
          rm -f "$key"
          yc config list | grep -v "service-account-key"
      - name: Build, push and deploy
        env:
          YES: "1"
          REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          SA_ID: ${{ vars.YC_SA_ID }}
          LOCKBOX_ID: ${{ vars.YC_LOCKBOX_ID }}
          LOCKBOX_OPTIONAL_KEYS: ${{ vars.YC_LOCKBOX_OPTIONAL_KEYS }}
        run: ./deploy/yandex/deploy.sh
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f "${CUMULUS_S3_CONTAINER:-cumulus-s3-${GITHUB_RUN_ID}}" >/dev/null 2>&1 || true
