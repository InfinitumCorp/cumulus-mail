name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cumulus_mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cumulus_mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The MinIO image is not anonymously pullable. The step below starts SeaweedFS S3.
    env:
      MAIL_RUNTIME_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cumulus_mail
      MAIL_S3_ENDPOINT: http://127.0.0.1:8333
      MAIL_S3_BUCKET: cumulus-mail
      MAIL_S3_REGION: us-east-1
      MAIL_S3_ACCESS_KEY_ID: cumulus
      MAIL_S3_SECRET_ACCESS_KEY: cumulussecret
      MAIL_S3_LOOPBACK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start SeaweedFS
        run: |
          mkdir -p /tmp/seaweedfs
          cat > /tmp/seaweedfs/s3.json <<'EOF'
          {
            "identities": [
              {
                "name": "cumulus",
                "credentials": [{ "accessKey": "cumulus", "secretKey": "cumulussecret" }],
                "actions": ["Admin", "Read", "List", "Tagging", "Write"]
              }
            ]
          }
          EOF
          docker run -d --name cumulus-s3 -p 8333:8333 \
            -v /tmp/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:3.97 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8333/ || true)
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs cumulus-s3
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
