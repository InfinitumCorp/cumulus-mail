name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cumulus_mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cumulus_mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # MinIO's image CMD is `minio` and does not start the server.
      # The step below runs `minio server /data` so the S3 tests have a local endpoint.
    env:
      MAIL_RUNTIME_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cumulus_mail
      MAIL_S3_ENDPOINT: http://127.0.0.1:9000
      MAIL_S3_BUCKET: cumulus-mail
      MAIL_S3_REGION: us-east-1
      MAIL_S3_ACCESS_KEY_ID: cumulus
      MAIL_S3_SECRET_ACCESS_KEY: cumulussecret
      MAIL_S3_LOOPBACK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MinIO
        run: |
          docker run -d --name cumulus-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cumulus \
            -e MINIO_ROOT_PASSWORD=cumulussecret \
            minio/minio:latest server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs cumulus-minio
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
