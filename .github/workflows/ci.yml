name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cumulus_mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cumulus_mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The MinIO image is not anonymously pullable. The step below starts SeaweedFS S3.
    env:
      MAIL_RUNTIME_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cumulus_mail
      MAIL_S3_ENDPOINT: http://127.0.0.1:8333
      MAIL_S3_BUCKET: cumulus-mail
      MAIL_S3_REGION: us-east-1
      MAIL_S3_ACCESS_KEY_ID: cumulus
      MAIL_S3_SECRET_ACCESS_KEY: cumulussecret
      MAIL_S3_LOOPBACK_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start SeaweedFS
        run: |
          set -euo pipefail
          name="cumulus-s3-${GITHUB_RUN_ID}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          # Older runs left a fixed-name container holding 8333 on the shared runner.
          docker rm -f cumulus-s3 >/dev/null 2>&1 || true
          port="$(python3 - <<'PY'
          import os, random, socket
          tail = int((os.environ.get("GITHUB_RUN_ID") or "0")[-5:])
          candidates = [8333, 20000 + (tail % 20000)]
          candidates += [random.randint(20000, 45000) for _ in range(12)]
          for port in candidates:
              sock = socket.socket()
              try:
                  sock.bind(("127.0.0.1", port))
              except OSError:
                  continue
              finally:
                  sock.close()
              print(port)
              break
          else:
              raise SystemExit("no free port for SeaweedFS")
          PY
          )"
          mkdir -p "/tmp/seaweedfs-${GITHUB_RUN_ID}"
          cat > "/tmp/seaweedfs-${GITHUB_RUN_ID}/s3.json" <<'EOF'
          {
            "identities": [
              {
                "name": "cumulus",
                "credentials": [{ "accessKey": "cumulus", "secretKey": "cumulussecret" }],
                "actions": ["Admin", "Read", "List", "Tagging", "Write"]
              }
            ]
          }
          EOF
          docker run -d --name "$name" -p "127.0.0.1:${port}:8333" \
            -v "/tmp/seaweedfs-${GITHUB_RUN_ID}/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}/" || true)
            if [ "$code" != "000" ]; then
              echo "MAIL_S3_ENDPOINT=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
              echo "CUMULUS_S3_CONTAINER=${name}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs "$name"
          exit 1
      # UI text and translations: en.json / catalogs.js current, and no locale missing a key.
      - run: npm run i18n -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Every migration against real Postgres 16 (the tests above use PGLite for most of the schema),
      # plus the read-only `db:status` check, in a database of its own: the test resets it.
      - name: Migrations on Postgres 16 (db:status / db:migrate)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/migrate_status
        run: |
          node -e "const pg=require('pg');const c=new pg.Client({connectionString:process.env.MAIL_RUNTIME_DATABASE_URL});c.connect().then(()=>c.query('create database migrate_status')).finally(()=>c.end())"
          node --test scripts/migrate-status.test.mjs
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f "${CUMULUS_S3_CONTAINER:-cumulus-s3-${GITHUB_RUN_ID}}" >/dev/null 2>&1 || true

  # Browser smoke tests against the local dev mode (no Cumulus ID, in-memory PGLite). Separate job so
  # a browser problem never hides the result of the main checks.
  e2e:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Performance budget: JS per route (gzip, exact) and Lighthouse-style timings against the production
  # build. perf-budget.json holds the numbers; raise them only in the change that needs it.
  perf:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Sign-in off, as in e2e, so "/" is the mail app itself rather than the sign-in screen.
      - run: VITE_AUTH_ENABLED=false npm run build:node
      - run: npm run perf
      # No server code (database adapter, migrator, storage, secret names) in the public client assets.
      - run: npm run bundle:check
      # The Content-Security-Policy, enforced, on the same production build: no violation on any screen.
      - run: npm run csp:check

  # The Russia copy (Yandex Cloud) runs this image. Build it and check it serves and reports healthy.
  # Nothing is pushed anywhere.
  docker:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cumulus-mail-ru:ci .
      - name: Run the image and check it
        run: |
          docker run -d --name mail-ru -p 8080:8080 -e MAIL_BLOB_KEY="$(openssl rand -hex 32)" cumulus-mail-ru:ci
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:8080/api/auth/get-session && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/api/auth/get-session
          curl -sf -o /dev/null http://127.0.0.1:8080/
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' mail-ru)" = healthy ] && break; sleep 2; done
          test "$(docker inspect -f '{{.State.Health.Status}}' mail-ru)" = healthy
      - if: always()
        run: docker logs mail-ru 2>&1 | tail -50; docker rm -f mail-ru >/dev/null 2>&1 || true
