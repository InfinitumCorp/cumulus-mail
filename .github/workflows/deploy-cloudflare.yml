# US production (Cloudflare Workers): cumulus-mail-inbound and/or cumulus-mail-api.
#
# Manual only: never runs on push. Runs in the `production-us` GitHub environment, which the owner
# configures with required reviewers and these secrets (Settings > Environments):
#   CLOUDFLARE_API_TOKEN   Workers Scripts edit (+ Hyperdrive read) on the account that owns cumulus-mail
#   CLOUDFLARE_ACCOUNT_ID
#   HYPERDRIVE_ID          32-hex id; replaces REPLACE_WITH_HYPERDRIVE_ID only.
#                          The committed id is d07a82ac7fcc42ac84dc6469140ef551 (cumulus-mail).
# Optional, synced to the worker as Cloudflare secrets when set:
#   MAIL_BLOB_KEY, MAIL_BLOB_KEYS and MAIL_BLIND_KEY (key rotation: docs/ops/key-rotation.md),
#   SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY,
#   BETTER_AUTH_SECRET (api), BETTER_AUTH_URL (api), STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (api)
#
# Guardrails (docs/deploy/cloudflare-handoff.md) are enforced by scripts/deploy-guard.mjs before any
# deploy: never the page worker `cumulus-mail`, no routes or custom domains, no Email Routing changes,
# no send_email, no R2. This workflow does not touch DNS or the Email Routing catch-all.
name: Deploy US (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which worker to deploy
        type: choice
        options: [inbound, api, both]
        default: inbound
      confirm:
        description: Type the account owner's confirmation phrase "deploy us" to proceed
        required: true
        type: string

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-us
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cumulus_mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cumulus_mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # No third-party grok.com script on any page (owner decision 2026-11-16). Off is also the code
      # default; set here so the build and the CSP say so explicitly.
      VITE_GROK_EXTENSIONS: "0"
      WRANGLER: npx --yes wrangler@4.157.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
      # Same local Postgres and S3 as CI, so npm test can run the runtime/S3 checks.
      MAIL_RUNTIME_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cumulus_mail
      MAIL_S3_ENDPOINT: http://127.0.0.1:8333
      MAIL_S3_BUCKET: cumulus-mail
      MAIL_S3_REGION: us-east-1
      MAIL_S3_ACCESS_KEY_ID: cumulus
      MAIL_S3_SECRET_ACCESS_KEY: cumulussecret
      MAIL_S3_LOOPBACK_ONLY: "1"
    steps:
      - name: Check the confirmation phrase
        if: inputs.confirm != 'deploy us'
        run: |
          echo "Confirmation phrase does not match. Nothing deployed."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start SeaweedFS
        run: |
          set -euo pipefail
          name="cumulus-s3-${GITHUB_RUN_ID}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          # Older runs left a fixed-name container holding 8333 on the shared runner.
          docker rm -f cumulus-s3 >/dev/null 2>&1 || true
          port="$(python3 - <<'PY'
          import os, random, socket
          tail = int((os.environ.get("GITHUB_RUN_ID") or "0")[-5:])
          candidates = [8333, 20000 + (tail % 20000)]
          candidates += [random.randint(20000, 45000) for _ in range(12)]
          for port in candidates:
              sock = socket.socket()
              try:
                  sock.bind(("127.0.0.1", port))
              except OSError:
                  continue
              finally:
                  sock.close()
              print(port)
              break
          else:
              raise SystemExit("no free port for SeaweedFS")
          PY
          )"
          mkdir -p "/tmp/seaweedfs-${GITHUB_RUN_ID}"
          cat > "/tmp/seaweedfs-${GITHUB_RUN_ID}/s3.json" <<'EOF'
          {
            "identities": [
              {
                "name": "cumulus",
                "credentials": [{ "accessKey": "cumulus", "secretKey": "cumulussecret" }],
                "actions": ["Admin", "Read", "List", "Tagging", "Write"]
              }
            ]
          }
          EOF
          docker run -d --name "$name" -p "127.0.0.1:${port}:8333" \
            -v "/tmp/seaweedfs-${GITHUB_RUN_ID}/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}/" || true)
            if [ "$code" != "000" ]; then
              echo "MAIL_S3_ENDPOINT=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
              echo "CUMULUS_S3_CONTAINER=${name}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs "$name"
          exit 1
      - name: Checks before deploying
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Account is set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          $WRANGLER whoami

      - name: Inbound worker - guard
        if: inputs.target == 'inbound' || inputs.target == 'both'
        run: node scripts/deploy-guard.mjs inbound --hyperdrive-id "$HYPERDRIVE_ID"
      - name: Inbound worker - secrets
        if: inputs.target == 'inbound' || inputs.target == 'both'
        working-directory: workers/email
        env:
          MAIL_BLOB_KEY: ${{ secrets.MAIL_BLOB_KEY }}
          MAIL_BLOB_KEYS: ${{ secrets.MAIL_BLOB_KEYS }}
          MAIL_BLIND_KEY: ${{ secrets.MAIL_BLIND_KEY }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          for name in MAIL_BLOB_KEY MAIL_BLOB_KEYS MAIL_BLIND_KEY SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | $WRANGLER secret put "$name" --config wrangler.deploy.json; fi
          done
      - name: Inbound worker - deploy
        if: inputs.target == 'inbound' || inputs.target == 'both'
        working-directory: workers/email
        run: $WRANGLER deploy --config wrangler.deploy.json

      - name: API worker - build and guard
        if: inputs.target == 'api' || inputs.target == 'both'
        env:
          APP_COMMIT: ${{ github.sha }}
        run: |
          npm run build:workers
          node scripts/deploy-guard.mjs api --hyperdrive-id "$HYPERDRIVE_ID"
      - name: API worker - secrets
        if: inputs.target == 'api' || inputs.target == 'both'
        working-directory: .output/server
        env:
          MAIL_BLOB_KEY: ${{ secrets.MAIL_BLOB_KEY }}
          MAIL_BLOB_KEYS: ${{ secrets.MAIL_BLOB_KEYS }}
          MAIL_BLIND_KEY: ${{ secrets.MAIL_BLIND_KEY }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          test -n "$BETTER_AUTH_SECRET" || { echo "BETTER_AUTH_SECRET is required for the API worker"; exit 1; }
          for name in MAIL_BLOB_KEY MAIL_BLOB_KEYS MAIL_BLIND_KEY SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY BETTER_AUTH_SECRET BETTER_AUTH_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | $WRANGLER secret put "$name" --config wrangler.deploy.json; fi
          done
      - name: API worker - deploy
        if: inputs.target == 'api' || inputs.target == 'both'
        working-directory: .output/server
        run: $WRANGLER deploy --config wrangler.deploy.json
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f "${CUMULUS_S3_CONTAINER:-cumulus-s3-${GITHUB_RUN_ID}}" >/dev/null 2>&1 || true
