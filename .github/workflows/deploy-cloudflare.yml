# US production (Cloudflare Workers): cumulus-mail-inbound and/or cumulus-mail-api.
#
# Manual only: never runs on push. Runs in the `production-us` GitHub environment, which the owner
# configures with required reviewers and these secrets (Settings > Environments):
#   CLOUDFLARE_API_TOKEN   Workers Scripts edit (+ Hyperdrive read) on the account that owns cumulus-mail
#   CLOUDFLARE_ACCOUNT_ID
#   HYPERDRIVE_ID          32-hex id of the production Hyperdrive config
# Optional, synced to the worker as Cloudflare secrets when set:
#   MAIL_BLOB_KEY, SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY,
#   BETTER_AUTH_SECRET (api), BETTER_AUTH_URL (api), STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (api)
#
# Guardrails (docs/deploy/cloudflare-handoff.md) are enforced by scripts/deploy-guard.mjs before any
# deploy: never the page worker `cumulus-mail`, no routes or custom domains, no Email Routing changes,
# no send_email, no R2. This workflow does not touch DNS or the Email Routing catch-all.
name: Deploy US (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which worker to deploy
        type: choice
        options: [inbound, api, both]
        default: inbound
      confirm:
        description: Type the account owner's confirmation phrase "deploy us" to proceed
        required: true
        type: string

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-us
    timeout-minutes: 30
    env:
      WRANGLER: npx --yes wrangler@4.157.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
    steps:
      - name: Check the confirmation phrase
        if: inputs.confirm != 'deploy us'
        run: |
          echo "Confirmation phrase does not match. Nothing deployed."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checks before deploying
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Account is set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          $WRANGLER whoami

      - name: Inbound worker - guard
        if: inputs.target == 'inbound' || inputs.target == 'both'
        run: node scripts/deploy-guard.mjs inbound --hyperdrive-id "$HYPERDRIVE_ID"
      - name: Inbound worker - secrets
        if: inputs.target == 'inbound' || inputs.target == 'both'
        working-directory: workers/email
        env:
          MAIL_BLOB_KEY: ${{ secrets.MAIL_BLOB_KEY }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          for name in MAIL_BLOB_KEY SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | $WRANGLER secret put "$name" --config wrangler.deploy.json; fi
          done
      - name: Inbound worker - deploy
        if: inputs.target == 'inbound' || inputs.target == 'both'
        working-directory: workers/email
        run: $WRANGLER deploy --config wrangler.deploy.json

      - name: API worker - build and guard
        if: inputs.target == 'api' || inputs.target == 'both'
        env:
          APP_COMMIT: ${{ github.sha }}
        run: |
          npm run build:workers
          node scripts/deploy-guard.mjs api --hyperdrive-id "$HYPERDRIVE_ID"
      - name: API worker - secrets
        if: inputs.target == 'api' || inputs.target == 'both'
        working-directory: .output/server
        env:
          MAIL_BLOB_KEY: ${{ secrets.MAIL_BLOB_KEY }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          test -n "$BETTER_AUTH_SECRET" || { echo "BETTER_AUTH_SECRET is required for the API worker"; exit 1; }
          for name in MAIL_BLOB_KEY SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY BETTER_AUTH_SECRET BETTER_AUTH_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | $WRANGLER secret put "$name" --config wrangler.deploy.json; fi
          done
      - name: API worker - deploy
        if: inputs.target == 'api' || inputs.target == 'both'
        working-directory: .output/server
        run: $WRANGLER deploy --config wrangler.deploy.json
