# Alternative to Serverless Containers: one Compute VM in ru-central1 running the
# same image behind a TLS reverse proxy (ALB, or nginx/Caddy on the VM).
# Secrets come from ru.env on the VM (chmod 600, never committed).
services:
  mail:
    image: cr.yandex/${REGISTRY_ID}/cumulus-mail-ru:${TAG:-latest}
    restart: unless-stopped
    env_file: ./ru.env
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/auth/get-session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
